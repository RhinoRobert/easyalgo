# Builds the app and publishes it to GitHub Pages (https://easyalgo.org).
# Pages used to serve the repository's source files, which a browser cannot run; this publishes the built `dist/` instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuilt every 20 minutes so each newly launched token gets its own page and appears in the sitemap and feed. If the chain can not be read during
  # the build, the build fails and the previous site stays live. (GitHub pauses scheduled runs after 60 days without a commit to the repository.)
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public network identifiers only; nothing here is a secret. They are compiled into the page.
      VITE_NETWORK: mainnet
      VITE_LAUNCHPAD_APP_ID: "3753531793"
      # MainNet launching stays OFF until the repository variable ENABLE_MAINNET_LAUNCHPAD is set to
      # I_ACCEPT_CONTROLLED_MAINNET_CANARY (Settings > Secrets and variables > Actions > Variables). Unset = read-only page.
      VITE_ENABLE_MAINNET_LAUNCHPAD: ${{ vars.ENABLE_MAINNET_LAUNCHPAD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - run: npm run build
      - name: Refuse to publish source files or the deployment console
        run: |
          test -f dist/index.html
          ! grep -q "/src/main.jsx" dist/index.html
          test -f dist/CNAME
          ! grep -rq "LOCAL-ONLY DEPLOYMENT GATE" dist/assets
      - name: Refuse to publish without the search files
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/og-image.png
          test -f dist/algorand-launchpad/index.html
          test -f dist/faq/index.html
          test -f dist/theme.js
          test -f dist/404.html
          test -f dist/feed.xml
          test "$(ls dist/token/*/index.html | wc -l)" -ge 1
          grep -q 'application/atom+xml' dist/index.html
          grep -q '<div id="root"><div class="shell">' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          ! grep -rqiE 'rug[[:space:]]?\.?[[:space:]]?ninja' dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4